name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --settings=platform_backend.test_settings
        env:
          MPLCONFIGDIR: /tmp/matplotlib
      - run: python manage.py makemigrations --check --dry-run --settings=platform_backend.test_settings
      - run: python manage.py test core.tests --settings=platform_backend.test_settings -v 2
        env:
          MPLCONFIGDIR: /tmp/matplotlib

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint -- --quiet
      - run: npm run build
      - name: Verify committed dist is current
        run: git diff --exit-code -- dist
