<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1f2937">
    <div style="max-width:560px;margin:32px auto;padding:32px;background:#fff;border-radius:14px;border:1px solid #e5e7eb">
      <h1 style="margin:0 0 16px;font-size:22px;color:#312e81">验证您的邮箱</h1>
      <p>您正在注册{{ platform_name }}。请在 {{ ttl_hours }} 小时内完成邮箱验证。</p>
      <p style="margin:28px 0">
        <a href="{{ activation_url }}" style="display:inline-block;padding:12px 22px;border-radius:9px;background:#4f46e5;color:#fff;text-decoration:none">验证邮箱</a>
      </p>
      <p style="font-size:13px;color:#6b7280">如果按钮无法打开，请复制以下链接到浏览器：</p>
      <p style="font-size:12px;word-break:break-all;color:#6b7280">{{ activation_url }}</p>
      <p style="font-size:13px;color:#9ca3af">如果这不是您的操作，请忽略本邮件。</p>
    </div>
  </body>
</html>
